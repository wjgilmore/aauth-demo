# Deploy this folder as its own Netlify site (set "Base directory" to "agent").
[build]
  base = "agent"
  publish = "public"
  command = "echo No build step"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "public"
  port = 8882
  functionsPort = 9992
  staticServerPort = 9982
  autoLaunch = false

# The PS redirects the person back here after they decide (callback_endpoint).
[[redirects]]
  from = "/callback"
  to = "/index.html"
  status = 200

# Plain-text pages: nothing may load from other sites (no third-party images,
# scripts, frames or fonts), even if a message somehow contained markup.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
