# Deploy this folder as its own Netlify site (set "Base directory" to "agent").
[build]
  base = "agent"
  publish = "public"
  command = "echo No build step"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "public"
  port = 8882
  functionsPort = 9992
  staticServerPort = 9982
  autoLaunch = false

# The PS redirects the person back here after they decide (callback_endpoint).
[[redirects]]
  from = "/callback"
  to = "/index.html"
  status = 200
