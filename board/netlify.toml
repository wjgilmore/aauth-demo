# Deploy this folder as its own Netlify site (set "Base directory" to "board").
[build]
  base = "board"
  publish = "public"
  command = "echo No build step"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "public"
  port = 8883
  functionsPort = 9993
  staticServerPort = 9983
  autoLaunch = false
