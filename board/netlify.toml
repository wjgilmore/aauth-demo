# Deploy this folder as its own Netlify site (set "Base directory" to "board").
[build]
  base = "board"
  publish = "public"
  command = "echo No build step"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "public"
  port = 8883
  functionsPort = 9993
  staticServerPort = 9983
  autoLaunch = false

# Plain-text pages: nothing may load from other sites (no third-party images,
# scripts, frames or fonts), even if a message somehow contained markup.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
